name: Install Smoke

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run_bun_global_install_smoke:
        description: Run the Bun global install and runtime smoke
        required: false
        default: false
        type: boolean
      update_baseline_version:
        description: Baseline openclaw version or dist-tag for installer update smoke
        required: false
        default: latest
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  sidebar_package:
    if: github.repository == 'simonwang794/openclaw' && github.event_name == 'workflow_dispatch' && github.ref_name == 'sidebar-unread-v2026.9.6-20261003'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.19.0'
          install-bun: 'false'
          cache-mode: restore
      - name: Build self-contained sidebar fix package
        run: node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog --output-dir .artifacts/sidebar-package
      - name: Record checksums
        run: cd .artifacts/sidebar-package && sha256sum ./*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sidebar-fix-package-${{ github.sha }}
          path: .artifacts/sidebar-package/
          if-no-files-found: error
          retention-days: 3

  install_smoke:
    if: github.repository == 'openclaw/openclaw'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/install-smoke-reusable.yml
    with:
      allow_unreleased_changelog: true
      ref: ${{ github.sha }}
      run_bun_global_install_smoke: ${{ github.event_name == 'schedule' || inputs.run_bun_global_install_smoke }}
      update_baseline_version: ${{ inputs.update_baseline_version || 'latest' }}
